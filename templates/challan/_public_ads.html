
{% if static_post_ads %}
  {% with ad=static_post_ads.0 %}
  <div class="psca-banner-media" aria-label="Public service announcement">
    {% if ad.banner_type == 'html' and ad.html_content %}
      <div class="psca-banner-html">{{ ad.html_content|safe }}</div>
    {% elif ad.image %}
      <a href="{{ ad.image_link|default:'#' }}" target="_blank" rel="noopener">
        <img src="{{ ad.image.url }}" alt="{{ ad.title|default:'Public service announcement' }}" loading="lazy">
      </a>
    {% else %}
      <div class="psca-banner-fallback" style="background: {{ ad.effective_bg_color }}; color: {{ ad.text_color|default:'#FFFFFF' }};">
        <i class="bi bi-shield-check"></i>
        <span>{{ ad.title }}</span>
      </div>
    {% endif %}
  </div>
  {% endwith %}
{% endif %}
