{% if static_post_ads %}
  {% with ad=static_post_ads.0 %}
  <section class="ph-banner-ads" aria-label="Banner advertisement">
    <div class="ph-big-banner">
      {% if ad.banner_type == 'html' and ad.html_content %}
        <div class="ph-big-banner-html">{{ ad.html_content|safe }}</div>
      {% elif ad.image %}
        {% if ad.image_link %}
        <a href="{{ ad.image_link }}" target="_blank" rel="noopener" class="ph-big-banner-link">
          <img src="{{ ad.image.url }}" alt="{{ ad.title|default:'Public service announcement' }}" loading="lazy">
        </a>
        {% else %}
          <img src="{{ ad.image.url }}" alt="{{ ad.title|default:'Public service announcement' }}" loading="lazy">
        {% endif %}
      {% else %}
        <div class="ph-big-banner-fallback" style="background: {{ ad.effective_bg_color }}; color: {{ ad.text_color|default:'#FFFFFF' }};">
          <i class="bi bi-shield-check"></i>
          <span>{{ ad.title }}</span>
        </div>
      {% endif %}
    </div>
  </section>
  {% endwith %}
{% endif %}
