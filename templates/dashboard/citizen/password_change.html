{% extends 'base.html' %}
{% load static %}
{% load humanize %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="sc-card" style="max-width:480px;">
<div class="sc-card-head">Change password</div>
<form method="post">
{% csrf_token %}
<div class="sc-form-group">
<label for="oldPassword">Current password *</label>
<input type="password" id="oldPassword" name="old_password" required autocomplete="current-password">
</div>
<div class="sc-form-group">
<label for="newPassword1">New password * (12+ chars)</label>
<input type="password" id="newPassword1" name="new_password1" minlength="12" required autocomplete="new-password">
</div>
<div class="sc-form-group">
<label for="newPassword2">Confirm new password *</label>
<input type="password" id="newPassword2" name="new_password2" minlength="12" required autocomplete="new-password">
</div>
<div class="sc-flex sc-gap-2">
<button type="submit" class="sc-btn sc-btn-primary">Update password</button>
<a href="{% url 'citizen_portal:home' %}" class="sc-btn">Cancel</a>
</div>
</form>
</div>
{% endblock %}
