{% extends 'base.html' %}
{% load static %}
{% load humanize %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="sc-card" style="max-width:640px;">
<div class="sc-card-head">Personal information</div>
<form method="post">
{% csrf_token %}
<div class="sc-form-group">
<label for="displayName">Display name *</label>
<input type="text" id="displayName" name="first_name" value="{{ user.first_name }}" required>
</div>
<div class="sc-form-group">
<label for="phone">Phone</label>
<input type="tel" id="phone" name="phone" value="{{ user.phone }}" placeholder="+92-300-1234567">
</div>
<div class="sc-form-group">
<label for="email">Email</label>
<input type="email" id="email" name="email" value="{{ user.email }}">
</div>
<div class="sc-form-group">
<label for="address">Address</label>
<textarea id="address" name="address" rows="3">{{ user.address|default:'' }}</textarea>
</div>
<div class="sc-flex sc-gap-2">
<button type="submit" class="sc-btn sc-btn-primary">Save changes</button>
<a href="{% url 'citizen_portal:home' %}" class="sc-btn">Cancel</a>
</div>
</form>
</div>
{% endblock %}
