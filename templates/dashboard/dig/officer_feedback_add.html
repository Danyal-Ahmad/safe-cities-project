{% extends 'base.html' %}
{% load static %}
{% block title %}Add Officer Feedback{% endblock %}

{% block body_class %}page-dig{% endblock %}
{% block content %}

<div class="sc-page-hero">
 <div>
 <h1><i class="bi bi-person-badge me-2"></i>Add Officer Feedback</h1>
 <p class=" opacity-75">Record performance feedback for an officer</p>
 </div>
 <a href="{% url 'dig:officer_feedback_list' %}" class="sc-btn sc-btn-primary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>

<div>
 <div>
 <div>
 <div class="card-header"><span><i class="bi bi-circle me-2"></i>Feedback details</span></div>
 <div class="card-body">
 <form method="post">
 {% csrf_token %}
 <div>
 <label>Officer *</label>
 <select name="officer_id" required>
 <option value="">- select officer -</option>
 {% for o in officers %}
 <option value="{{ o.id }}">{{ o.display_name }} ({{ o.email }})</option>
 {% endfor %}
 </select>
 </div>
 <div>
 <label>Rating <span class=" small">(1 = Poor · 5 = Excellent)</span></label>
 <select name="rating">
 <option value="5">5 | Excellent</option>
 <option value="4">4 | Good</option>
 <option value="3" selected>3 | Average</option>
 <option value="2">2 | Below average</option>
 <option value="1">1 | Poor</option>
 </select>
 </div>
 <div>
 <label>Feedback note</label>
 <textarea name="note" rows="4" placeholder="Detailed feedback for the officer"></textarea>
 </div>
 <div class="form-actions">
 <a href="{% url 'dig:officer_feedback_list' %}" class="sc-btn sc-btn-primary"><i class="bi bi-arrow-right-circle me-1"></i>Cancel</a>
 <button type="submit" class="btn btn-primary"><i class="bi bi-chat-left-text me-1"></i>Save Feedback</button>
 </div>
 </form>
 </div>
 </div>
 </div>
</div>
{% endblock %}
