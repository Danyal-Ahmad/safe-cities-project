{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security &amp; Account</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/sc-framework.css' %}">
<link rel="stylesheet" href="{% static 'css/pages/dig-profile-embed.css' %}">
<style>
  body { margin: 0; padding: 16px; background: var(--sc-bg, #E8EEF7); font-family: 'Inter', system-ui, sans-serif; }
</style>
</head>
<body>
  <div class="sec-card">
    <div class="sec-title"><i class="bi bi-shield-lock"></i> Account security</div>
    <div class="sec-row"><span class="sec-k">Account status</span>
      <span class="sec-v">{% if is_locked %}<span class="status-dot locked"></span>Locked{% else %}<span class="status-dot"></span>Active{% endif %}</span>
    </div>
    <div class="sec-row"><span class="sec-k">Last login</span><span class="sec-v">{{ last_login|default:"-" }}</span></div>
    <div class="sec-row"><span class="sec-k">Joined</span><span class="sec-v">{{ date_joined|default:"-" }}</span></div>
    <div class="sec-row"><span class="sec-k">Session portal</span><span class="sec-v">{{ own_namespace }}</span></div>
  </div>

  <div class="sec-card">
    <div class="sec-title"><i class="bi bi-key"></i> Change password</div>
    <form method="post" action="?embed=1" target="_parent">
      {% csrf_token %}
      <input type="hidden" name="action" value="password">
      <input type="password" name="old_password" aria-label="Password field" class="form-control form-control-sm" placeholder="Current password" required autocomplete="current-password">
      <input type="password" name="new_password" aria-label="Password field" class="form-control form-control-sm" placeholder="New password (min 12 chars)" required minlength="12" autocomplete="new-password">
      <input type="password" name="confirm_password" aria-label="Password field" class="form-control form-control-sm" placeholder="Confirm new password" required minlength="12" autocomplete="new-password">
      <button type="submit" class="sc-btn sc-btn-primary w-100"><i class="bi bi-arrow-repeat me-1"></i>Update password</button>
    </form>
  </div>
</body>
</html>
