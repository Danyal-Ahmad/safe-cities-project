{% extends 'base.html' %}
{% load static %}
{% block title %}Assign Shift — DIG{% endblock %}

{% block extra_head %}{% endblock %}
{% block content %}
<div class="sc-page-hero">
 <div>
 <h1><i class="bi bi-calendar-range me-2"></i>Assign Shift</h1>
 <p class=" opacity-75">Create a shift window. Leave officer empty for automatic assignment.</p>
 </div>
 <div>
 <a href="{% url 'dig:shift_management' %}" class="sc-btn sc-btn-primary">
 <i class="bi bi-circle"></i> Roster
 </a>
 </div>
</div>

<div>
 <div>
 <div class="card ">
 <div class=" p-4">
 <form method="post" novalidate>
 {% csrf_token %}
 <div>
 <div>
 <label class=" fw-semibold">Start time</label>
 <input type="datetime-local" name="start_time" required>
 </div>
 <div>
 <label class=" fw-semibold">End time</label>
 <input type="datetime-local" name="end_time" required>
 </div>
 <div>
 <label class=" fw-semibold">Officer (optional)</label>
 <select name="officer_id">
 <option value="">Auto-assign (least busy)</option>
 {% for o in officers %}
 <option value="{{ o.id }}">{{ o.display_name }} · {{ o.public_id|default:o.username }}</option>
 {% endfor %}
 </select>
 </div>
 </div>
 <div>
 <button type="submit" class="btn btn-primary"><i class="bi bi-calendar-range me-1"></i>Save shift</button>
 <a href="{% url 'dig:shift_management' %}" class="sc-btn sc-btn-primary">Cancel</a>
 </div>
 </form>
 </div>
 </div>
 </div>
</div>
{% endblock %}
